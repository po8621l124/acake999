<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<!-- 找不到頁面時 GitHub Pages 會顯示這頁；網址可能在任何層級，用 base 固定相對路徑（換正式網域時改成 /html/） -->
	<base href="/acake999/html/">
	<title>找不到頁面｜A. cake 台中司康</title>
	<link rel="icon" href="../image/icon/icon-48.png" sizes="48x48" type="image/png">
	<link rel="icon" href="../image/icon/icon-96.png" sizes="96x96" type="image/png">
	<link rel="icon" href="../image/icon/icon-192.png" sizes="192x192" type="image/png">
	<link rel="apple-touch-icon" href="../image/icon/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=LXGW+WenKai+TC:wght@400;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=LXGW+WenKai+TC:wght@400;700&display=swap"></noscript>
    <link rel="stylesheet" href="../css/ac_common.css">
<style>
/* ===== 404 ac404_ ===== */
.ac404{min-height: 100vh;min-height: 100svh;display: flex;align-items: center;justify-content: center;padding: calc(var(--hd_h) + 40px) var(--pdx) 80px;background: var(--color-bg2);text-align: center;}
.ac404_bg{position: relative;width: 180px;height: 220px;margin: 0 auto 26px;border-radius: 999px 999px 24px 24px;border: 8px solid #fff !important;background: url(../image/acake/480/p_box.webp) center / cover no-repeat;transform: rotate(-4deg);}
.ac404_bg::after{content: '';position: absolute;right: -62%;bottom: -10%;width: 78%;aspect-ratio: 1;background: url(../image/acake/deco/lava.webp) center / contain no-repeat;transform: rotate(16deg);filter: drop-shadow(0 12px 12px rgba(var(--rgb_cocoa),.28));}
.ac404_in{max-width: 640px;}
.hs_box .ac404_num{display: block;font-family: var(--Fraufont);font-weight: 700;font-size: clamp(5rem, 14vw, 10rem);line-height: .9;color: var(--color-Main);}
.hs_box .ac404_en{display: block;font-family: var(--Cavfont);font-size: var(--f40);line-height: 1.2;color: var(--color-alt);margin-top: 6px;}
.hs_box .ac404 h1{font-family: var(--Kaifont);font-weight: 700;font-size: var(--f35);letter-spacing: .12em;margin-top: 16px;}
.hs_box .ac404 p{color: var(--colorText-sub);margin-top: 14px;}
.ac404 .ac_btns{justify-content: center;margin-top: 34px;}
</style>
</head>
<body>

<script src="../js/ac_layout.js" data-part="header"></script>

<div class="hs_box">
<main id="main">
    <section class="ac404">
        <div class="ac404_in" data-animate-in="up">
            <div class="ac404_bg" aria-hidden="true"></div>
            <span class="ac404_num" aria-hidden="true">404</span>
            <span class="ac404_en" aria-hidden="true">Oops, no scone here!</span>
            <h1>找不到這個頁面</h1>
            <p>這個頁面可能已經移動或不存在。<br>回到首頁，或看看今天想吃哪一顆司康。</p>
            <div class="ac_btns">
                <a class="ac_btn fill" href="index.html"><span>回到首頁</span><i></i></a>
                <a class="ac_btn" href="products.html#menu"><span>看商品</span><i></i></a>
            </div>
        </div>
    </section>
</main>

<script src="../js/ac_layout.js" data-part="footer"></script>
</div>

<script src="../js/scrollfade.js"></script>
<script src="../js/ac_common.js"></script>
</body>
</html>
